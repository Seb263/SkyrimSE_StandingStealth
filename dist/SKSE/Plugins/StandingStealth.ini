; Standing Stealth - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# Completely enables or disables the mod (true / false).
bEnabled = true


[Actors]
# Allow the player to perform sneak attacks while standing (true / false).
bApplyOnPlayer = true

# Allow NPCs to perform sneak attacks while standing (true / false).
bApplyOnNPCs = true

# Allow followers to perform sneak attacks while standing (true / false).
bApplyOnFollowers = true


[WeaponTypes]
# Allow standing sneak attacks with hand-to-hand attacks (true / false).
bApplyOnHandToHand = true

# Allow standing sneak attacks with one-handed weapons (true / false).
bApplyOnOneHanded = true

# Allow standing sneak attacks with two-handed weapons (true / false).
bApplyOnTwoHandedWeapons = true

# Allow standing sneak attacks with daggers (true / false).
bApplyOnDaggers = true

# Allow standing sneak attacks with bows and other ranged weapons (true / false).
bApplyOnRanged = true
